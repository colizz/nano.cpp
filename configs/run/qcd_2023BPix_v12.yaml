# QCD channel runtime card for 2023BPix NanoAOD v12.
extends:
  - ../base.yaml
  - ../common/nano_branches_v12.yaml
  - ../common/read_branches_v12.yaml

era: "2023BPix"
nano_version: "v12"
preselection: nFatJet>1

output:
  include_ps_weights: true

# Use a reduced tagger list tailored to the QCD channel.
stored_tagger_names:
  - particleNetWithMass_HbbvsQCD
  - particleNetWithMass_HccvsQCD
  - particleNetWithMass_QCD
  - particleNet_QCD
  - particleNet_XbbVsQCD
  - particleNet_XccVsQCD
  - particleNet_massCorr

additional_read_branches:
  - PSWeight
  - SV_pt
  - SV_eta
  - SV_phi
  - SV_mass
  - SV_ntracks
  - SV_dxy
  - SV_dxySig
  - SV_dlen
  - SV_dlenSig
  - SV_chi2
  - SV_pAngle

required_triggers:
  - HLT_PFHT180
  - HLT_PFHT250
  - HLT_PFHT350
  - HLT_PFHT370
  - HLT_PFHT430
  - HLT_PFHT510
  - HLT_PFHT590
  - HLT_PFHT680
  - HLT_PFHT780
  - HLT_PFHT890
  - HLT_PFHT1050
