# QCD channel runtime card for 2016APV NanoAOD v9.
extends:
  - ../base.yaml
  - ../common/nano_branches_v9.yaml
  - ../common/read_branches_v9.yaml

era: "2016APV"
nano_version: "v9"
preselection: nFatJet>0

output:
  include_ps_weights: true

# Use a reduced tagger list tailored to the QCD channel.
stored_tagger_names:
  - deepTagMD_HbbvsQCD
  - deepTagMD_ZHbbvsQCD
  - deepTagMD_ZHccvsQCD
  - particleNetMD_QCD
  - particleNetMD_Xbb
  - particleNetMD_Xcc
  - particleNetMD_Xqq
  - particleNet_HbbvsQCD
  - particleNet_HccvsQCD
  - particleNet_QCD
  - particleNet_mass

additional_read_branches:
  - PSWeight
  - SV_pt
  - SV_eta
  - SV_phi
  - SV_mass
  - SV_ntracks
  - SV_dxy
  - SV_dxySig
  - SV_dlen
  - SV_dlenSig
  - SV_chi2
  - SV_pAngle

required_triggers:
  - HLT_PFHT125
  - HLT_PFHT200
  - HLT_PFHT250
  - HLT_PFHT300
  - HLT_PFHT350
  - HLT_PFHT400
  - HLT_PFHT475
  - HLT_PFHT600
  - HLT_PFHT650
  - HLT_PFHT800
  - HLT_PFHT900
